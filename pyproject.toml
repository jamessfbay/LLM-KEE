[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kee"
version = "0.1.0"
description = "Knowledge Evolution Engine for evidence-backed LLM knowledge systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]

[project.scripts]
llm-kee = "llm_kee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
